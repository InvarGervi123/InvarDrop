name: CI

on:
  push:
    branches: [main, "feature/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    name: Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential libssl-dev librsvg2-dev patchelf ffmpeg desktop-file-utils appstream
      - name: Install optional audio test dependency
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg --yes --no-progress
          $audioBinary = Get-ChildItem "$env:ChocolateyInstall\lib\ffmpeg" -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          if (-not $audioBinary) { throw "FFmpeg binary not found" }
          "INVARDROP_TEST_FFMPEG=$($audioBinary.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
      - name: Set up Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy
          rustup default stable
      - run: npm ci
      - name: Type-check frontend
        run: npm run check
      - name: Test sharing UI
        run: npm test
      - name: Check Rust formatting
        run: cargo fmt --manifest-path src-tauri/Cargo.toml --all -- --check
      - name: Test installer safety guards
        run: npm run test:packaging
      - name: Test Windows archive filename handling
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-packages.ps1 -SelfTest
      - name: Build installation packages
        run: npm run tauri build -- --ci -- --locked
      - name: Lint Rust
        run: cargo clippy --locked --manifest-path src-tauri/Cargo.toml --all-targets -- -D warnings
      - name: Test Rust and independent-device TLS processes
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml --all-targets
      - name: Inspect Linux package payloads
        if: runner.os == 'Linux'
        run: python3 scripts/verify-linux-packages.py
      - name: Verify Debian installation and removal
        if: runner.os == 'Linux'
        run: python3 scripts/check-deb-lifecycle.py
      - name: Inspect Windows packages without installing them
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/verify-windows-packages.ps1
      - name: Upload test installers
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invardrop-installers-${{ matrix.os }}-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            LICENSE
            README.md
            CHANGELOG.md
            docs/packaging.md
            docs/release-candidate.md
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/appimage/*.AppImage
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
            src-tauri/target/release/bundle/SHA256SUMS-*.txt
            src-tauri/target/release/bundle/package-audit-*.json

  android:
    name: Android release build (ARM64)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      - name: Set up Android tools
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          echo "JAVA_HOME=$JAVA_HOME" >> "$GITHUB_ENV"
          echo "$JAVA_HOME/bin" >> "$GITHUB_PATH"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platforms;android-37.0" "build-tools;36.0.0" "ndk;27.2.12479018"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.2.12479018" >> "$GITHUB_ENV"
      - name: Set up Rust for ARM64
        run: |
          rustup toolchain install stable --profile minimal --target aarch64-linux-android
          rustup default stable
      - run: npm ci
      - name: Generate the Android project
        run: npm run tauri -- android init --ci --skip-targets-install
      - name: Build an unsigned release APK
        run: npm run tauri -- android build --ci --target aarch64 --apk -- --locked
      - name: Test Android Kotlin helpers
        run: python3 scripts/test-android-import.py
      - name: Inspect APK and record its source
        run: |
          mkdir -p src-tauri/target/android-release
          version="$(node -p 'require("./package.json").version')"
          apk="InvarDrop_${version}_arm64-unsigned.apk"
          cp src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release-unsigned.apk \
            "src-tauri/target/android-release/$apk"
          python3 scripts/android-release.py --build-tools "$ANDROID_HOME/build-tools/36.0.0" \
            check-unsigned "src-tauri/target/android-release/$apk"
          cd src-tauri/target/android-release
          sha256sum "$apk" > SHA256SUMS-android-unsigned.txt
          echo "$GITHUB_SHA" > SOURCE-COMMIT.txt
      - name: Upload Android build verification
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: invardrop-android-arm64-verification-${{ github.sha }}
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
          path: |
            src-tauri/target/android-release/SHA256SUMS-android-unsigned.txt
            src-tauri/target/android-release/SOURCE-COMMIT.txt
