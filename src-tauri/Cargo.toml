[package]
name = "invardrop"
version = "0.1.0"
description = "Minimal cross-platform LAN file transfer application"
license = "Apache-2.0"
authors = ["Invar Gervi"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "invardrop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
blake3 = "1"
rfd = { version = "0.18", default-features = false, features = ["xdg-portal"] }
ring = "0.17"
rustls = { version = "0.23.46", default-features = false, features = ["std", "ring"] }
tokio-rustls = { version = "0.26.6", default-features = false, features = ["ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "net", "io-util", "fs", "time", "sync", "macros"] }
rcgen = { version = "0.14.10", default-features = false, features = ["crypto", "ring", "zeroize"] }
keyring = "4.2"
zeroize = "1"
tempfile = "3"
serde_json = "1"
thiserror = "2"
socket2 = "0.6"
mdns-sd = { version = "0.21.7", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
tauri = { version = "2", features = [] }
uuid = { version = "1.29.2", features = ["v4"] }


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
